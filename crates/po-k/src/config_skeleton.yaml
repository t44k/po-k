# po-k config — both keys are optional (a missing file means these defaults).
#
# Sessions carry their own settings (cwd, model, plugins, MCP servers, …) in the
# create request; see `GET /docs` on a running po-k.
#
# Overrides: POK_TOKEN_FILE / --token-file, POK_TOKEN (seeds the token file),
#            POK_BIND / --bind, POK_CONFIG (path of this file).

auth:
  bearer_token_file: ~/.config/po-k/auth.token

server:
  bind: 0.0.0.0:13658
